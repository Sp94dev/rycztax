<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rycztax</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script
      async
      src="https://docs.opencv.org/4.9.0/opencv.js"
      onload="onOpenCvReady();"
    ></script>
  </head>
  <body>
    <app-root></app-root>
    <script>
      // Ta funkcja jest wywoływana przez atrybut `onload` powyżej.
      // Tworzymy prosty event, na który nasza aplikacja będzie mogła nasłuchiwać.
      function onOpenCvReady() {
        document.body.dispatchEvent(new CustomEvent('opencv-ready'));
      }
    </script>
  </body>
</html>
